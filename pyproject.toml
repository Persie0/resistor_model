[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resistor-model"
version = "0.1.0"
description = "Structured resistor color-band recognition training stack"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "PyYAML>=6",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "torchvision>=0.17", "Pillow>=10"]
export = ["onnx>=1.16", "onnxscript>=0.1"]
resnet = ["torchvision>=0.17"]
segmentation = ["torchvision>=0.17", "Pillow>=10"]
detection = [
  "torchvision>=0.17",
  "Pillow>=10",
  "torchmetrics>=1.4",
  "pycocotools>=2.0.7",
  "ijson>=3.3",
]

[project.scripts]
resistor-train = "resistor_model.train:main"
resistor-evaluate = "resistor_model.evaluate:main"
resistor-export = "resistor_model.export:main"
resistor-train-segmentation = "resistor_model.train_segmentation:main"
resistor-export-segmentation = "resistor_model.export_segmentation:main"
resistor-train-detection = "resistor_model.train_detection:main"
resistor-export-detection = "resistor_model.export_detection:main"
resistor-audit = "resistor_model.tools.audit_dataset:main"
resistor-split = "resistor_model.tools.make_splits:main"
resistor-convert-yolo = "resistor_model.tools.convert_yolo:main"
resistor-import-roboflow = "resistor_model.tools.import_roboflow_yolo:main"
resistor-import-coco = "resistor_model.tools.import_roboflow_coco:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
