name: Mobile1D XL and synthetic data tests
on:
  pull_request:
    paths:
      - "src/resistor_model/**"
      - "colab/train_rres_mobile1d*"
      - "colab/prepare_mobile1d_segsynthetic_colab.ipynb"
      - "tests/test_mobile1d*"
      - "tests/test_training_lr_extension.py"

concurrency:
  group: mobile1d-xl-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -e '.[dev,export]'
      - name: Validate Mobile1D, XL, preprocessing and resume
        run: |
          python -m pytest -q \
            tests/test_mobile1d.py \
            tests/test_mobile1d_xl_colab.py \
            tests/test_mobile1d_colab_cache.py \
            tests/test_mobile1d_segsynthetic.py \
            tests/test_segmentation_release.py \
            tests/test_training_lr_extension.py \
            tests/test_runtime.py \
            tests/test_dataset.py
